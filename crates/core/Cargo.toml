[package]
name = "tableport-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# All database work for the app. Swift calls it through bindings that UniFFI
# generates (make core); the app links the static library.
[lib]
name = "tableport_core"
# staticlib: linked into the app. cdylib: only read by uniffi-bindgen for
# the bindings. lib: for the integration tests.
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.32", features = ["cli"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "fs"] }
tokio-postgres = "0.7"
postgres-native-tls = "0.5"
native-tls = "0.2"
futures-util = "0.3"
sqlformat = "0.5"  # Beautify in the query editor
# Format JSON in the cell editor: keeps key order and exact numbers.
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
# Local store: query history and saved queries. Bundled, so no system SQLite version matters.
# libSQL and Turso: the Hrana protocol, JSON over HTTPS. Native TLS, as for the others.
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
# Redis. Native TLS for rediss://, as for the others.
redis = { version = "1.7", default-features = false, features = ["aio", "tokio-comp", "tokio-native-tls-comp"] }
# SQL Server and Azure SQL. Native TLS, as for the others; chrono to show dates.
tiberius = { version = "0.13", default-features = false, features = ["tds80", "native-tls", "chrono"] }
tokio-util = { version = "0.7", features = ["compat"] }
# Cassandra and ScyllaDB. rustls with ring, as the MongoDB driver uses: no C toolchain.
scylla = { version = "1.9", features = ["rustls-023", "chrono-04"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"  # verify-full for Cassandra: Mozilla's root certificates, as the MongoDB driver uses
uuid = "1"  # checks UUIDs typed into Cassandra cells
async-trait = "0.1"  # the driver's AddressTranslator, for SSH tunnels
chrono = { version = "0.4", default-features = false, features = ["alloc"] }  # Cassandra dates as text
# MongoDB: the official driver.
mongodb = "3.9"
# MySQL and MariaDB. Native TLS, as for PostgreSQL; the Rust zlib, so no C toolchain.
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust", "native-tls-tls"] }
rusqlite = { version = "0.37", features = ["bundled", "column_decltype"] }
# SSH tunnel. ring instead of the default aws-lc-rs, which needs a C toolchain build.
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2"] }  # reading the simple-query stream message by message

[dev-dependencies]
futures = "0.3"  # catch_unwind, so a failed test still drops its schema
